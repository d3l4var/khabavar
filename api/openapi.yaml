openapi: 3.1.0
info:
  title: KHABAVAR Platform API
  version: 1.1.0
  description: |
    قرارداد API پلتفرم خواب‌آور — KH-API-001 نسخه ۱.۱

    مبنای هم‌سویی:
    - SAD v2.0 مصوب: Monolith Modular با مرزهای ۹ ماژول، Backend API واحد روی دامنه اصلی
    - CIAM v1.0: OIDC Auth Code + PKCE، نشست مستقل به ازای هر سرویس، OTP با هش
    - DB Migrations مرحله ۳ (۵۲ جدول): وضعیت‌ها و شناسه‌ها عیناً هم‌سو
    - IAM مصوب: Scope هر سرویس + RBAC نقش‌محور در پنل مدیریت

    تغییرات نسخه ۱.۱.۰ (تصمیمات مالک 2026-11-25 — سجل کامل: KH-INDEX-001 v1.1 §۷):
    - افزودن POST /orders/{orderNumber}/return-requests — مرجوعی پس‌تحویل مشتری (PRD SH-M09)
    - CartItem.availability شش وضعیت مشتری‌روی — بازگشت SUPPLIER_AVAILABLE و PRE_ORDER و PENDING_VERIFICATION
    - چرخه عمر تأمین‌کننده: ۸ وضعیت مصوب + PROBATION نگه‌داری‌شده در این نسخه با قابلیت حذف؛ RETIRED حذف (≈ INACTIVE)
    - یادداشت SupplyType: MIXED استراتژی سطح محصول است؛ منبع Fulfillment به‌ازای هر سفارش تصمیم‌گیری می‌شود
    - ماتریس RBAC اکنون ۱۰ نقش است (بازگشت SUPPLIER_OPERATOR از CIAM §۶)

    قواعد عمومی قرارداد:
    - همه مبالغ: عدد صحیح ریال (BIGINT) — تبدیل به تومان فقط در لایه نمایش (ADR-DATA-001)
    - شناسه تجاری سفارش: KHA-ORD-YYYY-NNNNNN — مستقل از UUID داخلی
    - هدر Idempotency-Key روی تمام POSTهای مالی الزامی است (ADR-ARCH-008)
    - صفحه‌بندی: page و page_size (پیش‌فرض ۲۰، حداکثر ۱۰۰)
    - پاکت خطای یکسان با کد ماشین‌خوان (schema: Error)
    - زمان: ISO 8601 با UTC؛ نمایش کلاینت با Asia/Tehran (DB v2 §۴.۳)
    - فارسی‌سازی پیام‌های کاربرنما مسئولیت لایه BFF است؛ کدهای خطا ثابت و انگلیسی‌اند

servers:
  - url: https://api.khabavar.ir/v1
    description: Production
  - url: https://api-staging.khabavar.ir/v1
    description: Staging
  - url: http://localhost:8080/v1
    description: Development

