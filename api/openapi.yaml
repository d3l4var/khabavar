  /catalog/products/{slug}/articles:
    get:
      operationId: getCatalogProductsSlugArticles
      tags: [magazine]
      summary: مقالات مرتبط با محصول
      description: فقط ارتباط‌های EDUCATIONAL و PRODUCT_GUIDE با دلیل ثبت‌شده (MA-5) — بدون دستکاری تجاری محتوای علمی.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: مقالات مرتبط
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArticleSummaryList" }

  # ───────────────────────── admin — کاتالوگ ─────────────────────────
  /admin/products:
    get:
      operationId: getAdminProducts
      tags: [catalog]
      summary: محصولات در پنل (شامل پیش‌نویس‌ها)
      description: مسیر پنل/ویترین که پیش‌تر فقط در کد بود؛ اکنون در قرارداد قابل کشف است.
      security: []
      responses:
        "200": { description: پاسخ موفق }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postAdminProducts
      tags: [admin-products]
      summary: ایجاد محصول و Variantها
      security:
        - oauth2: [staff]
      description: مجوز لازم — catalog.product.edit (STORE_MANAGER)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductUpsert" }
      responses:
        "201":
          description: محصول با وضعیت DRAFT ایجاد شد
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/products/{productId}:
    get:
      operationId: getAdminProductsProductId
      tags: [admin-catalog]
      summary: جزئیات محصول در پنل (شامل پیش‌نویس)
      description: خواندن پنل که پیش‌تر فقط در کد بود؛ اکنون در قرارداد قابل کشف است.
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: پاسخ موفق }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchAdminProductsProductId
      tags: [admin-products]
      summary: ویرایش محصول
      description: ویرایش محصول. وضعیت انتشار از این مسیر تغییر نمی‌کند؛ مسیر status و دروازهٔ انتشار را دارد.
      security:
        - oauth2: [staff]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductUpsert" }
      responses:
        "200":
          description: به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{productId}/status:
    post:
      operationId: postAdminProductsProductIdStatus
      tags: [admin-products]
      summary: تغییر وضعیت محصول در چرخه QC
      description: گذارهای مجاز — DRAFT→DATA_REVIEW→APPROVED→PUBLISHED؛ وضعیت‌های PAUSED/DISCONTINUED هم از PUBLISHED.
      security:
        - oauth2: [staff]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductStatusInput" }
      responses:
        "200":
          description: وضعیت تغییر کرد
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "409":
          description: گذار از وضعیت فعلی مجاز نیست
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/products/{productId}/publish:
    post:
      operationId: postAdminProductsProductIdPublish
      tags: [admin-products]
      summary: انتشار محصول — دروازه QC-05
      description: |
        سرور دروازه‌ها را کنترل می‌کند و رد شدنی را دور می‌زند:
        sleep_relevance (MA-1)، spec_source و spec_last_reviewed_at (MA-6)،
        حداقل یک تصویر، یک Variant فعال با قیمت تأییدشده.
        در CHECK دیتابیس هم تضمین شده (chk_products_publish_gates).
      security:
        - oauth2: [staff]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: منتشر شد
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "409":
          description: PUBLISH_GATE_FAILED — فهرست کمبودها در details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ───────────────────────── admin — تأمین و موجودی ─────────────────────────
  /admin/suppliers:
    post:
      operationId: postAdminSuppliers
      tags: [admin-supply]
      summary: ثبت تأمین‌کننده
      description: مجوز supplier.manage — ثبت/تأیید تأمین‌کننده در Audit Log حساس ثبت می‌شود (DB §13.1).
      security:
        - oauth2: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201":
          description: ثبت شد
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/suppliers/{supplierId}:
    patch:
      operationId: patchAdminSuppliersSupplierId
      tags: [admin-supply]
      summary: ویرایش یا تغییر وضعیت تأمین‌کننده
      description: ویرایش پروفایل تأمین‌کننده. وضعیت از این مسیر تغییر نمی‌کند؛ مسیر /status را دارد.
      security:
        - oauth2: [staff]
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SupplierInput"
                - type: object
                  properties:
                    status:
                      type: string
                      enum: [PROSPECT, DOCUMENTS_PENDING, UNDER_REVIEW, APPROVED, ACTIVE, PROBATION, SUSPENDED, REJECTED, INACTIVE]
                      description: |
                        چرخه عمر تأمین‌کننده — هشت وضعیت مصوب Supplier Eval §7 + PROBATION.
                        PROBATION با تصمیم مالک 2026-11-25 در این نسخه نگه‌داری شده و در نسخه بعدی قابل حذف است.
                        RETIRED نسخه قبل حذف شد (معادل INACTIVE). وضعیت‌های پیش‌تأیید خط لوله onboarding را می‌سازند (AD-M03).
      responses:
        "200": { description: به‌روزرسانی شد }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/suppliers/{supplierId}/evaluations:
    get:
      operationId: getAdminSuppliersSupplierIdEvaluations
      tags: [admin-suppliers]
      summary: ارزیابی‌های یک تأمین‌کننده
      description: خواندن پنل که پیش‌تر فقط در کد بود؛ اکنون در قرارداد قابل کشف است.
      security: []
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: پاسخ موفق }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postAdminSuppliersSupplierIdEvaluations
      tags: [admin-supply]
      summary: ثبت ارزیابی وزنی تأمین‌کننده
      description: مجوز supplier.evaluate — نسخه وزن‌ها در رکورد قفل می‌شود (DB §7.4).
      security:
        - oauth2: [staff]
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierEvaluationInput" }
      responses:
        "201": { description: ارزیابی ثبت شد }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/stock:
    get:
      operationId: getAdminStock
      tags: [admin-supply]
      summary: موجودی انبارها
      description: موجودی جاری واریانت‌ها در انبارها؛ فقط خواندنی.
      security:
        - oauth2: [staff]
      parameters:
        - { name: warehouse_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string }, description: جست‌وجو بر اساس SKU یا عنوان }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: موجودی‌ها با available محاسبه‌شده
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockBalanceList" }

  /admin/stock/movements:
    post:
      operationId: postAdminStockMovements
      tags: [admin-supply]
      summary: ثبت حرکت موجودی
      description: مجوز inventory.adjust — اصلاح فقط با حرکت؛ رزرو/آزادسازی با قفل ردیفی در تراکنش (DB §14.2).
      security:
        - oauth2: [staff]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockMovementInput" }
      responses:
        "201":
          description: حرکت ثبت و موجودی به‌روز شد
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: موجودی منفی نمی‌شود (DB §8.2)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/reservations:
    get:
      operationId: getAdminReservations
      tags: [admin-supply]
      summary: رزروهای موجودی
      description: فهرست رزروهای موجودی برای پایش و آزادسازی.
      security:
        - oauth2: [staff]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ReservationStatus" } }
        - { name: expires_before, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: رزروها
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationList" }

  # ───────────────────────── admin — قیمت‌گذاری ─────────────────────────
  /admin/variants/{variantId}/cost-records:
    get:
      operationId: getAdminVariantsVariantIdCost-records
      tags: [admin-pricing]
      summary: تاریخچهٔ بهای تمام‌شدهٔ واریانت
      description: خواندن پنل که پیش‌تر فقط در کد بود؛ اکنون در قرارداد قابل کشف است.
      security: []
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: پاسخ موفق }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postAdminVariantsVariantIdCostRecords
      tags: [admin-pricing]
      summary: ثبت هزینه تمام‌شده
      description: مجوز pricing.cost.manage (STORE_MANAGER/FINANCE) — ثبت در Audit Log حساس.
      security:
        - oauth2: [staff]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostRecordInput" }
      responses:
        "201": { description: رکورد هزینه ثبت شد }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/variants/{variantId}/price-records:
    get:
      operationId: getAdminVariantsVariantIdPrice-records
      tags: [admin-pricing]
      summary: تاریخچهٔ قیمت فروش واریانت
      description: خواندن پنل که پیش‌تر فقط در کد بود؛ اکنون در قرارداد قابل کشف است.
      security: []
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: پاسخ موفق }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: postAdminVariantsVariantIdPriceRecords
      tags: [admin-pricing]
      summary: پیشنهاد قیمت فروش
      description: رکورد با وضعیت در انتظار تأیید ثبت می‌شود — تأیید نقش مجاز الزامی است (DB §9.2).
      security:
        - oauth2: [staff]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PriceRecordInput" }
      responses:
        "201": { description: ثبت شد — در انتظار تأیید }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/price-records/{priceRecordId}/approve:
    post:
      operationId: postAdminPriceRecordsPriceRecordIdApprove
      tags: [admin-pricing]
      summary: تأیید یا رد قیمت فروش
      description: مجوز pricing.price.approve — STORE_MANAGER یا FINANCE.
      security:
        - oauth2: [staff]
      parameters:
        - { name: priceRecordId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveInput" }
      responses:
        "200": { description: تصمیم ثبت شد — قیمت معتبر با valid_from فعال می‌شود }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── admin — سفارش‌ها ─────────────────────────
  /admin/orders:
    get:
      operationId: getAdminOrders
      tags: [admin-orders]
      summary: فهرست سفارش‌ها
      description: فهرست سفارش‌ها با فیلتر وضعیت و صفحه‌بندی برای پنل عملیات.
      security:
        - oauth2: [staff]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: q, in: query, schema: { type: string }, description: شماره سفارش، تلفن یا نام گیرنده }
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: سفارش‌ها
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }

  /admin/orders/{orderNumber}/fulfillments:
    post:
      operationId: postAdminOrdersOrderNumberFulfillments
      tags: [admin-orders]
      summary: ایجاد Fulfillment (تفکیک منبع تأمین)
      description: مجوز order.manage — مجموع تخصیص هر قلم در تراکنش کنترل می‌شود (DB §11.2).
      security:
        - oauth2: [staff]
      parameters:
        - $ref: "#/components/parameters/OrderNumberPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfillmentInput" }
      responses:
        "201": { description: Fulfillment ایجاد شد؛ برای SUPPLIER_SOURCED درخواست تأیید تأمین ثبت می‌شود }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: مجموع تخصیص از تعداد قلم بیشتر نمی‌شود
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/fulfillments/{fulfillmentId}/shipments:
    post:
      operationId: postAdminFulfillmentsFulfillmentIdShipments
      tags: [admin-orders]
      summary: ثبت مرسوله برای Fulfillment
      description: هر Fulfillment می‌تواند چند Shipment داشته باشد (DB §11.3 / ADR-COM-001).
      security:
        - oauth2: [staff]
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentInput" }
      responses:
        "201": { description: مرسوله ثبت شد }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/shipments/{shipmentId}/events:
    post:
      operationId: postAdminShipmentsShipmentIdEvents
      tags: [admin-orders]
      summary: ثبت رویداد رهگیری
      description: ثبت ترتیب زمانی — از MANUAL یا Webhook بار (DB §11.5)؛ تغییر وضعیت سفارش در Audit ثبت می‌شود.
      security:
        - oauth2: [staff]
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShipmentEventInput" }
      responses:
        "201": { description: رویداد ثبت شد }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/return-requests:
    get:
      operationId: getAdminReturnRequests
      tags: [admin-orders]
      summary: صف درخواست‌های مرجوعی
      description: پیش‌تر فقط انتقال با شناسه وجود داشت، پس کارمند نمی‌توانست صفی را که باید کار کند ببیند.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [REQUESTED, APPROVED, REJECTED, RECEIVED, REFUNDED] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: پاسخ موفق }
        "400": { description: وضعیت ناشناخته }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/return-requests/{id}/refund:
    post:
      operationId: postAdminReturnRequestsIdRefund
      tags: [admin-orders]
      summary: بازپرداخت یک مرجوعی دریافت‌شده
      description: RECEIVED → REFUNDED. مبلغ را کارمند تعیین می‌کند، چون درخواست فقط تعداد دارد و نه قلم کالا.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, format: int64, minimum: 1, description: مبلغ به ریال }
                note: { type: string }
      responses:
        "200": { description: بازپرداخت صادر و درخواست بسته شد }
        "400": { description: مبلغ نامعتبر یا بدنهٔ خراب }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: درخواست در وضعیت RECEIVED نیست، یا مبلغ از پرداخت‌شده بیشتر است }
  /admin/return-requests/{id}/approve:
    post:
      operationId: postAdminReturnRequestsIdApprove
      tags: [admin-orders]
      summary: تأیید درخواست مرجوعی
      description: REQUESTED → APPROVED. تصمیم کارمند است؛ مشتری فقط درخواست ثبت می‌کند.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200": { description: درخواست تأیید شد }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: انتقال نامعتبر از وضعیت فعلی }
  /admin/return-requests/{id}/reject:
    post:
      operationId: postAdminReturnRequestsIdReject
      tags: [admin-orders]
      summary: رد درخواست مرجوعی
      description: REQUESTED → REJECTED. یادداشت الزامی است — مشتری مستحق دلیل است.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        "200": { description: درخواست رد شد }
        "400": { description: یادداشت الزامی است }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: انتقال نامعتبر از وضعیت فعلی }
  /admin/return-requests/{id}/receive:
    post:
      operationId: postAdminReturnRequestsIdReceive
      tags: [admin-orders]
      summary: ثبت دریافت کالای مرجوعی
      description: APPROVED → RECEIVED. پول جابه‌جا نمی‌شود؛ بازپرداخت گام جداگانهٔ حسابرسی‌شده است.
