  /orders/{id}/confirm-payment:
    post:
      operationId: postOrdersIdConfirmpayment
      tags: [orders]
      summary: تأیید پرداخت سفارش (اعلان درگاه)
      description: >
        نقطهٔ ورود اعلان درگاه. مسیر عمومی است، پس بدنه باید با همان کلید HMAC مسیر
        /payments/webhook امضا شود؛ فراخوانی بدون امضا ۴۰۱ می‌گیرد. تکرار اعلان برای سفارش
        پرداخت‌شده ۲۰۰ با already_paid برمی‌گرداند (idempotent).
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: X-Provider-Signature
          in: header
          required: true
          description: HMAC-SHA256 بدنهٔ خام با PaymentWebhookSecret
          schema: { type: string }
      responses:
        "200": { description: پاسخ موفق }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

