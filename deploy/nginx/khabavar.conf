# KHABAVAR — nginx reverse proxy (DEP §۴)
# چهار Server Block + HSTS + HTTP/2 + rate limit auth/otp (دفاع دو لایه).
# ⚠️ انتخاب Caddy/Nginx باز بود — پیش‌فرض پیشنهادی: Nginx + certbot.
#
# Routing rules that matter for the OIDC flow:
#   /oauth/*            → identity unit (authorize + token). Without this the SPA would
#                         answer with index.html and the redirect would never happen.
#   /api/v1/auth/*      → identity unit, rate limited (OTP + staff login).
#   /api/*              → API unit.
#   everything else     → the SPA, with index.html fallback, which is what serves
#                         /auth/callback (the OIDC redirect_uri) — it must NOT be
#                         proxied to the identity unit.

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

upstream khabavar_api { server 127.0.0.1:8080; }
upstream khabavar_identity { server 127.0.0.1:8081; }

# Shared proxy headers: without X-Forwarded-Proto the Go services see plain HTTP and
# would issue the session cookie without Secure.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

server {  # khabavar.ir — main site
    listen 443 ssl http2;
    server_name khabavar.ir;
    root /var/www/main/current;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/v1/auth/ { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://khabavar_identity; }
    location /oauth/ { proxy_pass http://khabavar_identity; }
    location /api/ { proxy_pass http://khabavar_api; }
    location / { try_files $uri $uri/ /index.html; }
}

server {  # shop.khabavar.ir
    listen 443 ssl http2;
    server_name shop.khabavar.ir;
    root /var/www/shop/current;
    location /api/v1/auth/ { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://khabavar_identity; }
    location /oauth/ { proxy_pass http://khabavar_identity; }
    location /api/ { proxy_pass http://khabavar_api; }
    location / { try_files $uri $uri/ /index.html; }
}

server {  # magazine.khabavar.ir
    listen 443 ssl http2;
    server_name magazine.khabavar.ir;
    root /var/www/magazine/current;
    location /api/v1/auth/ { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://khabavar_identity; }
    location /oauth/ { proxy_pass http://khabavar_identity; }
    location /api/ { proxy_pass http://khabavar_api; }
    location / { try_files $uri $uri/ /index.html; }
}

server {  # admin.khabavar.ir — پنل + scope staff
    listen 443 ssl http2;
    server_name admin.khabavar.ir;
    root /var/www/admin/current;
    # The panel authenticates through the code flow, so it needs /oauth and the
    # /auth/callback page (served by the SPA fallback below).
    location /api/v1/auth/ { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://khabavar_identity; }
    location /oauth/ { proxy_pass http://khabavar_identity; }
    location /api/ { proxy_pass http://khabavar_api; }
    location / { try_files $uri $uri/ /index.html; }
}
