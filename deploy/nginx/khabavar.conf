# KHABAVAR — nginx reverse proxy (DEP §۴)
# چهار Server Block + HSTS + HTTP/2 + rate limit auth/otp (دفاع دو لایه).
# ⚠️ انتخاب Caddy/Nginx باز بود — پیش‌فرض پیشنهادی: Nginx + certbot.

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

# Redirect HTTP -> HTTPS + HSTS روی همه دامنه‌ها (certbot --nginx خود افزود می‌کند).

upstream khabavar_api { server 127.0.0.1:8080; }
upstream khabavar_identity { server 127.0.0.1:8081; }

server {  # khabavar.ir — main site
    listen 443 ssl http2;
    server_name khabavar.ir;
    root /var/www/main/current;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://khabavar_api; }
    location /auth/ { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://khabavar_identity; }
}

server {  # shop.khabavar.ir
    listen 443 ssl http2;
    server_name shop.khabavar.ir;
    root /var/www/shop/current;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://khabavar_api; }
    location /auth/ { limit_req zone=auth_zone burst=5 nodelay; proxy_pass http://khabavar_identity; }
}

server {  # magazine.khabavar.ir
