# Prometheus scrape config for khabavar (R-18 §۶)
# Scrape the three units' /metrics endpoints every 15s.

scrape_configs:
  - job_name: khabavar-api
    static_configs:
      - targets: ['127.0.0.1:8080']
        labels:
          unit: api
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: khabavar-identity
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels:
          unit: identity
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: khabavar-worker
    static_configs:
      - targets: ['127.0.0.1:8082']
        labels:
          unit: worker
    metrics_path: /metrics
    scrape_interval: 15s

  # PostgreSQL exporter (optional, for DB-level metrics)
  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']
    scrape_interval: 30s
